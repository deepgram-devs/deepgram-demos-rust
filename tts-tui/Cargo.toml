[package]
name = "tts-tui"
version = "0.10.0"
edition = "2021" # Use 2021 edition
description = "A terminal user interface for Deepgram Text-to-Speech through hosted, self-hosted, or SageMaker-hosted Deepgram with Aura, Aura-2, and Flux (including Early Access languages) voice selection, filtering, WebSocket streaming, rotating logs, themes, volume normalization, multi-format audio output, and audio caching"

[dependencies]
ratatui = { version = "0.30.2", features = ["crossterm"] }
crossterm = { version = "0.29.0", features = ["events", "serde"] }
# reqwest needs `json` and `rustls-tls` or `native-tls`. For simplicity, I'll use `native-tls` here.
# For async operations, we need to use the `tokio` runtime.
reqwest = { version = "0.13.5", features = ["json", "stream", "rustls" ], default-features = false }
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
tokio-util = "0.7.20"
futures-util = "0.3.34"
rustls = { version = "0.23.46", features = ["ring"] }
aws-config = "1.13.0"
# Disable the default `rustls` feature: it enables the legacy hyper 0.14 / rustls 0.21 client with known RustSec advisories.
aws-sdk-sagemakerruntime = { version = "1.123.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
rodio = "0.22"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
dotenvy = "0.15.7"
directories = "6.0.0"
sha2 = "0.11.1"
anyhow = "1.0.104"
url = "2.5.8"
async-trait = "0.1.92"
base64 = "0.23.1"
uuid = { version = "1.29.1", features = ["v4", "fast-rng", "serde"] }
lazy_static = "1.5.1"
arboard = "3.7.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
rust_decimal = "1.43.0"
mp3-duration = "0.1.10"
claxon = "0.4"
toml = "1.2.1"
chrono = "0.4.45"
