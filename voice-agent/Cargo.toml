[package]
name = "voice-agent"
version = "0.1.6"
edition = "2021"
description = "A Deepgram Voice Agent client for real-time bidirectional voice conversation via WebSocket"

[features]
default = ["aec"]
aec = ["dep:aec3"]

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.28.0", features = ["native-tls"] }
url = "2.5"
futures-util = "0.3"
cpal = "0.16.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15.7"
bytes = "1"
log = "0.4"
env_logger = "0.11.8"
rodio = "0.21.1"
clap = { version = "4.0", features = ["derive", "env"] }
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = { version = "0.29", features = ["events"] }
arboard = "3.4"
directories = "6.0.0"
noyalib = { version = "0.0.58", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
aec3 = { version = "=0.4.0", default-features = false, optional = true }
