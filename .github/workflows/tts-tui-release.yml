name: TTS TUI Release

on:
  push:
    tags: ["tts-tui-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tts-tui tag to build and publish
        required: true
        default: tts-tui-v0.9.5

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/reusable-rust-release.yml
    with:
      app: tts-tui
      binary: tts-tui
      cargo_package: tts-tui
      source_directory: tts-tui
      tag: ${{ inputs.tag || github.ref_name }}
      description: Terminal user interface for Deepgram text-to-speech.
      homepage: https://github.com/deepgram-devs/deepgram-demos-rust/tree/main/tts-tui
