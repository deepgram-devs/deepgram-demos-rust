name: Reusable Rust Application Release

on:
  workflow_call:
    inputs:
      app:
        description: Release name and Scoop package name
        required: true
        type: string
      binary:
        description: Executable name without a platform extension
        required: true
        type: string
      cargo_package:
        description: Cargo package passed to cargo build --package
        required: true
        type: string
      source_directory:
        description: Directory that contains application documentation
        required: true
        type: string
      tag:
        description: Existing annotated tag to build and publish
        required: true
        type: string
      description:
        description: Scoop package description
        required: true
        type: string
      homepage:
        description: Application homepage URL
        required: true
        type: string
      shortcut_name:
        description: Optional Windows Start Menu shortcut name
        required: false
        default: ''
        type: string

concurrency:
  group: scoop-bucket-manifest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - id: version
        shell: bash
        env:
          APP: ${{ inputs.app }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#${APP}-v}"
          test "$version" != "$TAG"
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            archive_kind: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive_kind: tar.gz
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive_kind: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive_kind: tar.gz
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            archive_kind: zip
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive_kind: zip

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev pkg-config libgl1-mesa-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev libxrandr-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --package ${{ inputs.cargo_package }} --target ${{ matrix.target }}

      - id: package_unix
        name: Package Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        env:
          APP: ${{ inputs.app }}
          BINARY: ${{ inputs.binary }}
          SOURCE_DIRECTORY: ${{ inputs.source_directory }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          package_dir="package"
          archive="$APP-$VERSION-$TARGET.tar.gz"
          mkdir "$package_dir"
          cp "target/$TARGET/release/$BINARY" "$package_dir/$BINARY"
          for document in README.md CHANGELOG.md TESTPLAN.md; do
            test -f "$SOURCE_DIRECTORY/$document" && cp "$SOURCE_DIRECTORY/$document" "$package_dir/"
          done
          cp LICENSE.md "$package_dir/"
          chmod +x "$package_dir/$BINARY"
          tar -czf "$archive" -C "$package_dir" .
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - id: package_windows
        name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          APP: ${{ inputs.app }}
          BINARY: ${{ inputs.binary }}
          SOURCE_DIRECTORY: ${{ inputs.source_directory }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $packageDir = 'package'
          $archive = "$($env:APP)-$($env:VERSION)-$($env:TARGET).zip"
          New-Item -ItemType Directory -Path $packageDir | Out-Null
          Copy-Item "target/$env:TARGET/release/$env:BINARY.exe" "$packageDir/$env:BINARY.exe"
          foreach ($document in 'README.md', 'CHANGELOG.md', 'TESTPLAN.md') {
            $documentPath = Join-Path $env:SOURCE_DIRECTORY $document
            if (Test-Path -LiteralPath $documentPath) {
              Copy-Item -LiteralPath $documentPath -Destination $packageDir
            }
          }
          Copy-Item LICENSE.md $packageDir
          Compress-Archive -Path "$packageDir/*" -DestinationPath $archive
          "archive=$archive" | Add-Content -Path $env:GITHUB_OUTPUT

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.app }}-${{ matrix.target }}
          path: ${{ steps.package_unix.outputs.archive || steps.package_windows.outputs.archive }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release and Scoop manifest
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums and release notes
        shell: bash
        env:
          APP: ${{ inputs.app }}
          SOURCE_DIRECTORY: ${{ inputs.source_directory }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          sha256sum release-assets/* > release-assets/SHA256SUMS.txt
          changelog="$SOURCE_DIRECTORY/CHANGELOG.md"
          if test -f "$changelog"; then
            awk -v version="$VERSION" '
              $0 ~ "^## \\[?" version "([[:space:]]|\\]|$)" { in_section = 1 }
              in_section && /^## / && $0 !~ "^## \\[?" version "([[:space:]]|\\]|$)" { exit }
              in_section { print }
            ' "$changelog" > release-notes.md
          fi
          if ! test -s release-notes.md; then
            printf '## %s v%s\n\nPrecompiled binaries for macOS, Linux, and Windows.\n' "$APP" "$VERSION" > release-notes.md
          fi

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TITLE: ${{ inputs.app }} v${{ needs.prepare.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TITLE" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TITLE" --notes-file release-notes.md
          fi

      - name: Check out the Scoop bucket branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: bucket-repository

      - name: Update the release-backed Scoop manifest
        shell: bash
        env:
          APP: ${{ inputs.app }}
          BINARY: ${{ inputs.binary }}
          DESCRIPTION: ${{ inputs.description }}
          HOMEPAGE: ${{ inputs.homepage }}
          SHORTCUT_NAME: ${{ inputs.shortcut_name }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          repo="https://github.com/$GITHUB_REPOSITORY"
          base_url="$repo/releases/download/$TAG"
          x64_asset="$APP-$VERSION-x86_64-pc-windows-msvc.zip"
          arm64_asset="$APP-$VERSION-aarch64-pc-windows-msvc.zip"
          x64_hash="$(sha256sum "release-assets/$x64_asset" | awk '{print $1}')"
          arm64_hash="$(sha256sum "release-assets/$arm64_asset" | awk '{print $1}')"
          manifest="bucket-repository/scoop/bucket/$APP.json"
          mkdir -p "$(dirname "$manifest")"
          jq -n \
            --arg version "$VERSION" \
            --arg description "$DESCRIPTION" \
            --arg homepage "$HOMEPAGE" \
            --arg notes "Installed from the $TAG GitHub release." \
            --arg binary "$BINARY.exe" \
            --arg shortcut "$SHORTCUT_NAME" \
            --arg x64_url "$base_url/$x64_asset" \
            --arg x64_hash "$x64_hash" \
            --arg arm64_url "$base_url/$arm64_asset" \
            --arg arm64_hash "$arm64_hash" \
            '{
              version: $version,
              description: $description,
              homepage: $homepage,
              license: "ISC",
              notes: $notes,
              architecture: {
                "64bit": { url: $x64_url, hash: $x64_hash },
                "arm64": { url: $arm64_url, hash: $arm64_hash }
              },
              bin: $binary
            } | if $shortcut != "" then .shortcuts = [[$binary, $shortcut]] else . end' > "$manifest"

      - name: Commit Scoop manifest update
        shell: bash
        env:
          APP: ${{ inputs.app }}
        run: |
          set -euo pipefail
          cd bucket-repository
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "scoop/bucket/$APP.json"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(scoop): publish $APP release manifest"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
