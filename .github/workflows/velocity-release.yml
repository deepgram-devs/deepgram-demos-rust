name: Velocity Release

on:
  push:
    tags: ["velocity-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Velocity tag to build and publish
        required: true
        default: velocity-v0.5.1

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/reusable-rust-release.yml
    with:
      app: velocity
      binary: velocity
      cargo_package: velocity
      source_directory: velocity
      tag: ${{ inputs.tag || github.ref_name }}
      description: Windows voice dictation using Deepgram Voice AI.
      homepage: https://github.com/deepgram-devs/deepgram-demos-rust/tree/main/velocity
      shortcut_name: Velocity
