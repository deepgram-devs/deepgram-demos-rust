name: Velocity Release

on:
  push:
    tags: ["velocity-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Velocity tag to build and publish
        required: true
        default: velocity-v0.5.1

concurrency:
  group: scoop-bucket-manifest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - id: version
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#velocity-v}"
          test "$version" != "$TAG"
          echo "value=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build Windows 11 ${{ matrix.architecture }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            architecture: x64
            archive_suffix: windows-x64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            architecture: ARM64
            archive_suffix: windows-arm64

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --package velocity --target ${{ matrix.target }}

      - id: package
        name: Package Windows artifact
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCHIVE_SUFFIX: ${{ matrix.archive_suffix }}
        run: |
          $packageDir = 'package'
          $archive = "velocity-$($env:VERSION)-$($env:ARCHIVE_SUFFIX).zip"
          New-Item -ItemType Directory -Path $packageDir | Out-Null
          Copy-Item "target/$env:TARGET/release/velocity.exe" "$packageDir/velocity.exe"
          Copy-Item velocity/README.md, velocity/CHANGELOG.md, velocity/TESTPLAN.md, LICENSE.md $packageDir
          Compress-Archive -Path "$packageDir/*" -DestinationPath $archive
          "archive=$archive" | Add-Content -Path $env:GITHUB_OUTPUT

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v7
        with:
          name: velocity-${{ matrix.target }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish Windows 11 release and Scoop manifest
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums and release notes
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          sha256sum release-assets/* > release-assets/SHA256SUMS.txt
          awk -v version="$VERSION" '
            $0 ~ "^## \\[?" version "([[:space:]]|\\]|$)" { in_section = 1 }
            in_section && /^## / && $0 !~ "^## \\[?" version "([[:space:]]|\\]|$)" { exit }
            in_section { print }
          ' velocity/CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "Velocity v$VERSION" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "Velocity v$VERSION" --notes-file release-notes.md
          fi

      - name: Check out the Scoop bucket branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: bucket-repository

      - name: Update the Velocity Scoop manifest
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          repo="https://github.com/$GITHUB_REPOSITORY"
          x64_asset="velocity-$VERSION-windows-x64.zip"
          arm64_asset="velocity-$VERSION-windows-arm64.zip"
          x64_hash="$(sha256sum "release-assets/$x64_asset" | awk '{print $1}')"
          arm64_hash="$(sha256sum "release-assets/$arm64_asset" | awk '{print $1}')"
          jq -n \
            --arg version "$VERSION" \
            --arg notes "Installed from the $TAG GitHub release." \
            --arg x64_url "$repo/releases/download/$TAG/$x64_asset" \
            --arg x64_hash "$x64_hash" \
            --arg arm64_url "$repo/releases/download/$TAG/$arm64_asset" \
            --arg arm64_hash "$arm64_hash" \
            '{
              version: $version,
              description: "Windows 11 voice dictation using Deepgram Voice AI.",
              homepage: "https://github.com/deepgram-devs/deepgram-demos-rust/tree/main/velocity",
              license: "ISC",
              notes: $notes,
              architecture: {
                "64bit": { url: $x64_url, hash: $x64_hash },
                "arm64": { url: $arm64_url, hash: $arm64_hash }
              },
              bin: "velocity.exe",
              shortcuts: [["velocity.exe", "Velocity"]]
            }' > bucket-repository/scoop/bucket/velocity.json

      - name: Commit Scoop manifest update
        shell: bash
        run: |
          set -euo pipefail
          cd bucket-repository
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scoop/bucket/velocity.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore(scoop): publish velocity release manifest'
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
